# Single-page static server for nscale-calc.
#
# /healthz is served from memory so the kubelet probes never touch disk and
# never redirect. That last part is deliberate: probing a path that 302s
# means the probe actually tests wherever the redirect lands, including
# that route's middleware — the failure mode behind homelab#820, where
# trilium's probes followed /login onto a rate-limited route and restarted
# the pod 151 times in 23h.
server {
    listen       8080;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    # Belt and braces with the page's own <meta charset>. Without a charset
    # on the Content-Type header, a browser is free to guess, and it guesses
    # Latin-1 — which renders the arrow in "Prototype → model" as "â†'" and
    # mangles every — and ½ on the page. The page carries a meta charset too;
    # either alone fixes it, but the header is what a fetch/curl consumer
    # sees, so set both.
    charset utf-8;

    # Static, self-contained page — nothing to proxy, nothing to rewrite.
    location / {
        try_files $uri $uri/ =404;
    }

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # The page is edited in git and shipped in the image, so a new version
    # is always a new image tag. Keep the browser from pinning an old copy.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
